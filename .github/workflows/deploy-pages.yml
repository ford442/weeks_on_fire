# Verify the Vite app on every pull request and push to main; deploy dist/ to GitHub Pages from
# main (or a manual run) once the same checks pass.
# Repo Settings → Pages → Source: GitHub Actions
name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default, which is all a fork pull request is given. Only the deploy job (never run
# for a pull request) asks for pages/id-token.
permissions:
  contents: read

# Deploys share one group so a newer push replaces an older one. Pull requests get their own
# group per PR so they can never cancel a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Codegen check
        run: npm run codegen:check

      - name: Agent docs check
        run: npm run agent-docs:check

      - name: Test
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `${k}: ${t[k].pct}% (${t[k].covered}/${t[k].total})`;
              console.log(["## Coverage", "", ...["lines", "statements", "functions", "branches"].map((k) => "- " + row(k))].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      # vite-imagetools re-encodes every card still (AVIF/WebP x 3 widths); cold that is ~2 CPU
      # minutes. Its cache is content-addressed, so a restored older cache is always safe.
      - name: Restore image variant cache
        uses: actions/cache@v4
        with:
          path: .cache/imagetools
          key: imagetools-${{ hashFiles('images/**', 'characters/**', 'ideas/**', 'episodes/**', 'scripts/content-index/image-variants.ts') }}
          restore-keys: imagetools-

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /weeks_on_fire/

      # Raw chunk budgets: entry, Songs/Suggestions route chunks, any lazy chunk, and no full
      # song or cutaway record in any JS chunk.
      - name: Bundle size check
        run: npx tsx scripts/check-bundle-size.ts

      # Simulated mobile (slow 4G, 4x CPU) on /, /show/songs, /show/sequences, /show/cartoons:
      # LCP, CLS and script transfer budgets in lighthouserc.json. A failure fails the build job,
      # so the deploy job never runs.
      - name: Lighthouse CI budgets
        run: npx lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 14
          if-no-files-found: ignore

      # Vitest runs under jsdom, which has no WebGL. This opens the build just made (same
      # VITE_BASE) in Chromium with software GL and checks the 3D player draws real frames.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Real-GL frame harness
        run: npm run test:e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # Pull requests verify only; they never deploy or request the github-pages environment.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Every hub route must be a real page (200), not the 404.html SPA fallback.
      # sitemap.xml is emitted from the same route table as dist/show/**/index.html.
      - name: Check route pages return 200
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          sleep 15
          urls=$(curl -fsSL --retry 5 --retry-all-errors "$base/sitemap.xml" | grep -o '<loc>[^<]*/show/[^<]*</loc>' | sed 's/<[^>]*>//g')
          count=$(echo "$urls" | grep -c . || true)
          if [ "$count" -lt 10 ]; then echo "Only $count /show/ routes in sitemap.xml"; exit 1; fi
          failed=0
          for url in $urls; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$url")
            if [ "$code" != "200" ]; then echo "::error::$code $url"; failed=$((failed + 1)); fi
          done
          echo "Checked $count routes, $failed failed"
          [ "$failed" -eq 0 ]
